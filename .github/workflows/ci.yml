name: CI/CD Pipeline

on:
  push:
    branches:
      - main

# Дозвола за GitHub Actions да може автоматски да прави push на новите манифести во репозиториумот
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Билдање и испраќање на Backend имиџот (со latest таг и уникатен sha таг)
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nvd-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/nvd-backend:${{ github.sha }}

      # 2. Билдање и испраќање на Frontend имиџот (со latest таг и уникатен sha таг)
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nvd-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/nvd-frontend:${{ github.sha }}

      # 3. CD БОНУС: Автоматско ажурирање на Kubernetes манифестите со новиот таг
      - name: Update Kubernetes manifests (GitOps CD)
        run: |
          sed -i "s|image: .*/nvd-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/nvd-backend:${{ github.sha }}|g" k8s/04-backend.yaml
          sed -i "s|image: .*/nvd-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/nvd-frontend:${{ github.sha }}|g" k8s/05-frontend.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || (git commit -m "CD: Update image tags to ${{ github.sha }} [skip ci]" && git push)