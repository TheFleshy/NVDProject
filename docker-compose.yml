version: '3.8'

services:
  nvd-database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nvd_db_data:/var/lib/postgresql/data

  nvd-backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=nvd-database
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      - nvd-database

  nvd-frontend:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - nvd-backend

volumes:
  nvd_db_data: