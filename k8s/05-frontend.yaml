apiVersion: v1
kind: Service
metadata:
  name: nvd-frontend-svc
  namespace: nvd-system
spec:
  selector:
    app: nvd-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvd-frontend
  namespace: nvd-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvd-frontend
  template:
    metadata:
      labels:
        app: nvd-frontend
    spec:
      containers:
        - name: frontend
          image: stojkovskiandrej/nvd-frontend:aece43e02bff6fd4669ee48ba7b70a8e4bb8c8d6
          ports:
            - containerPort: 3000