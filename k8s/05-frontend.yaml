apiVersion: v1
kind: Service
metadata:
  name: nvd-frontend-svc
  namespace: nvd-system
spec:
  selector:
    app: nvd-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvd-frontend
  namespace: nvd-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvd-frontend
  template:
    metadata:
      labels:
        app: nvd-frontend
    spec:
      containers:
        - name: frontend
          image: stojkovskiandrej/nvd-frontend:582507f58f5027ef3bf85c1b0e737e71e8a8c869

          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://nvd-backend-svc:5000"